<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daikin Stylish – Anatomie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:1}

/* corner brackets */
.corner{position:absolute;width:22px;height:22px;opacity:.28}
.corner.tl{top:28px;left:32px;border-top:1px solid #fff;border-left:1px solid #fff}
.corner.tr{top:28px;right:32px;border-top:1px solid #fff;border-right:1px solid #fff}
.corner.bl{bottom:28px;left:32px;border-bottom:1px solid #fff;border-left:1px solid #fff}
.corner.br{bottom:28px;right:32px;border-bottom:1px solid #fff;border-right:1px solid #fff}

/* brand */
#brand{position:absolute;top:36px;left:52px;
  font:400 8px/1 sans-serif;letter-spacing:7px;text-transform:uppercase;color:rgba(255,255,255,.22)}

/* main headline – cinematic style */
#headline{position:absolute;bottom:110px;left:52px;
  transition:opacity 1.2s ease, transform 1.2s ease;opacity:0;transform:translateY(12px)}
#hl-top{font:300 11px/1 sans-serif;letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:9px}
#hl-main{font:300 38px/1.05 'Helvetica Neue',sans-serif;color:rgba(255,255,255,.92);
  letter-spacing:-1px;max-width:340px}
#hl-sub{font:300 11px/1.6 sans-serif;letter-spacing:.3px;color:rgba(255,255,255,.28);
  margin-top:12px;max-width:280px;font-size:10px}

/* phase indicator bottom-right */
#phase-wrap{position:absolute;bottom:36px;right:52px;text-align:right}
#phase{font:400 8px/1 sans-serif;letter-spacing:5px;text-transform:uppercase;
  color:rgba(255,255,255,.25);margin-bottom:8px}
#bar{width:120px;height:1px;background:rgba(255,255,255,.08);margin-left:auto}
#bar-fill{height:100%;background:rgba(255,255,255,.35);width:0}

/* state dots */
#dots{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .6s}
.dot.on{background:rgba(255,255,255,.65)}

/* hint */
#hint{position:absolute;top:36px;right:52px;font:400 7px/1 sans-serif;
  letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div id="ui">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="brand">Daikin</div>
  <div id="hint">Drag to rotate</div>
  <div id="headline">
    <div id="hl-top">Stylish · R-32</div>
    <div id="hl-main">Crafted<br><em>in precision.</em></div>
    <div id="hl-sub">Scroll to witness the anatomy of silence — from void to form, from raw engineering to the invisible.</div>
  </div>
  <div id="phase-wrap">
    <div id="phase">Vue d'ensemble</div>
    <div id="bar"><div id="bar-fill"></div></div>
  </div>
  <div id="dots">
    <div class="dot on" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
  </div>
</div>

<!-- ─── All scripts inlined below by build step ─── -->
<script src="three.min.js"></script>
<script src="libjs/shaders/CopyShader.js"></script>
<script src="libjs/shaders/LuminosityHighPassShader.js"></script>
<script src="libjs/postprocessing/Pass.js"></script>
<script src="libjs/postprocessing/ShaderPass.js"></script>
<script src="libjs/postprocessing/MaskPass.js"></script>
<script src="libjs/postprocessing/EffectComposer.js"></script>
<script src="libjs/postprocessing/RenderPass.js"></script>
<script src="libjs/postprocessing/UnrealBloomPass.js"></script>
<script src="libjs/geometries/RoundedBoxGeometry.js"></script>
<script>
'use strict';
const {RoundedBoxGeometry,EffectComposer,RenderPass,UnrealBloomPass}=THREE;

/* ══════════════════════════════════════════════
   RENDERER
══════════════════════════════════════════════ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.insertBefore(renderer.domElement,document.getElementById('ui'));

/* ══════════════════════════════════════════════
   SCENE
══════════════════════════════════════════════ */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.055);

/* ══════════════════════════════════════════════
   CAMERA
══════════════════════════════════════════════ */
const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,100);
camera.position.set(4.5,2.0,6.5);
camera.lookAt(0,0,0);

/* ══════════════════════════════════════════════
   ENVIRONMENT MAP  (studio highlights for specular)
══════════════════════════════════════════════ */
{
  const W=512,H=256,ec=document.createElement('canvas');
  ec.width=W;ec.height=H;
  const ex=ec.getContext('2d');
  // pitch black base
  ex.fillStyle='#000000';ex.fillRect(0,0,W,H);
  // top-center spotlight bloom (main key light reflection)
  const top=ex.createRadialGradient(W*.5,0,0,W*.5,0,H*.7);
  top.addColorStop(0,'rgba(255,255,240,.38)');
  top.addColorStop(.4,'rgba(200,210,255,.06)');
  top.addColorStop(1,'rgba(0,0,0,0)');
  ex.fillStyle=top;ex.fillRect(0,0,W,H);
  // rear rim highlight (blue-ish)
  const rim=ex.createRadialGradient(W*.5,H,0,W*.5,H,H*.9);
  rim.addColorStop(0,'rgba(80,100,200,.12)');
  rim.addColorStop(1,'rgba(0,0,0,0)');
  ex.fillStyle=rim;ex.fillRect(0,0,W,H);
  // subtle side highlights
  [[0,H*.4],[W,H*.4]].forEach(([x,y])=>{
    const sg=ex.createRadialGradient(x,y,0,x,y,H*.5);
    sg.addColorStop(0,'rgba(120,140,180,.07)');
    sg.addColorStop(1,'rgba(0,0,0,0)');
    ex.fillStyle=sg;ex.fillRect(0,0,W,H);
  });
  const et=new THREE.CanvasTexture(ec);
  et.mapping=THREE.EquirectangularReflectionMapping;
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromEquirectangular(et).texture;
  et.dispose();pmrem.dispose();
}

/* ══════════════════════════════════════════════
   POST-PROCESSING
══════════════════════════════════════════════ */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(
  new THREE.Vector2(innerWidth,innerHeight),
  1.20,  // strength
  0.55,  // radius
  0.55   // threshold – catch specular peaks
);
composer.addPass(bloom);

/* ══════════════════════════════════════════════
   LIGHTS  –  dramatic single-spot aesthetic
══════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x03030A,1.0));

// MAIN KEY  –  overhead-front SpotLight, creates drama
const key=new THREE.SpotLight(0xFFFFF8,5.5,28,Math.PI/5.5,.55,1.8);
key.position.set(0,11,5);
key.target.position.set(0,0,0);
scene.add(key);scene.add(key.target);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=2;key.shadow.camera.far=28;
key.shadow.bias=-0.0003;key.shadow.radius=18;

// RIM  –  cold blue from behind, separates form from void
const rim=new THREE.SpotLight(0x8899DD,2.0,22,Math.PI/4,.7,2);
rim.position.set(1.5,4,-9);
rim.target.position.set(0,0,0);
scene.add(rim);scene.add(rim.target);

// FILL  –  barely visible, just to reveal detail on shadow side
const fill=new THREE.DirectionalLight(0x111122,.20);
fill.position.set(8,2,3);
scene.add(fill);

// NEON accents (explode phase)
const nA=new THREE.PointLight(0x4488FF,.0,8,2);scene.add(nA);
const nB=new THREE.PointLight(0x88CCFF,.0,6,2);nB.position.set(.4,.1,.4);scene.add(nB);
const nC=new THREE.PointLight(0x2266FF,.0,10,2);scene.add(nC);

/* ══════════════════════════════════════════════
   BACKGROUND  –  pure void, very dark gradient
══════════════════════════════════════════════ */
{
  const bc=document.createElement('canvas');bc.width=2;bc.height=512;
  const bx=bc.getContext('2d');
  const bg=bx.createLinearGradient(0,0,0,512);
  bg.addColorStop(0,'#03030A');bg.addColorStop(.6,'#010105');bg.addColorStop(1,'#000000');
  bx.fillStyle=bg;bx.fillRect(0,0,2,512);
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(60,16,8),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),side:THREE.BackSide,depthWrite:false})
  ));
}

/* ══════════════════════════════════════════════
   PARTICLES  –  micro dust, barely visible
══════════════════════════════════════════════ */
{
  const N=600,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*50;pos[i*3+1]=(Math.random()-.5)*28;pos[i*3+2]=(Math.random()-.5)*38-5;}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({
    color:0x4466AA,size:.010,sizeAttenuation:true,
    transparent:true,opacity:.20,blending:THREE.AdditiveBlending,depthWrite:false
  })));
}

/* ══════════════════════════════════════════════
   UNIT DIMS
══════════════════════════════════════════════ */
const UW=3.0,UH=3.0*295/795,UD=3.0*225/795;

/* ══════════════════════════════════════════════
   MATERIAL PALETTE  –  chrome obsidian
══════════════════════════════════════════════ */
function mkMat(o){
  return new THREE.MeshPhysicalMaterial(Object.assign({
    metalness:.95,roughness:.08,
    clearcoat:1.0,clearcoatRoughness:.06,
    envMapIntensity:2.8,reflectivity:1.0
  },o));
}
const M={
  // Main shell parts – deep obsidian chrome
  body:    mkMat({color:0x0A0A0F}),
  front:   mkMat({color:0x0D0D14,roughness:.06,clearcoatRoughness:.03,envMapIntensity:3.2}),
  inner:   mkMat({color:0x1A1E28,roughness:.22,metalness:.70,clearcoat:.50,envMapIntensity:1.8}),
  // Aluminium heat exchanger – brushed chrome
  alu:     mkMat({color:0x1C2530,roughness:.12,metalness:.98,envMapIntensity:3.5}),
  finSep:  mkMat({color:0x0E1520,roughness:.18,metalness:.96,envMapIntensity:2.8}),
  // Steel bracket
  metal:   mkMat({color:0x181E28,roughness:.20,metalness:.94,envMapIntensity:2.2}),
  // Fan – dark chrome
  fan:     mkMat({color:0x0C0C12,roughness:.15,metalness:.88,clearcoat:.70}),
  // PCB – dark green, emissive traces
  pcb: new THREE.MeshPhysicalMaterial({
    color:0x040C06,roughness:.55,metalness:.05,
    emissive:new THREE.Color(0x001A08),emissiveIntensity:3.5,
    clearcoat:.3,clearcoatRoughness:.5
  }),
  // Drain pan – lighter tone
  drain:   mkMat({color:0x2C3040,roughness:.35,metalness:.60,clearcoat:.40}),
  // Air vane
  vane:    mkMat({color:0x080810,roughness:.10,clearcoatRoughness:.04}),
  // Filter – translucent mesh
  filter: new THREE.MeshPhysicalMaterial({
    color:0x0A0A12,roughness:.80,metalness:.05,
    transparent:true,opacity:.72,
    clearcoat:.2,clearcoatRoughness:.8
  }),
  void: new THREE.MeshPhysicalMaterial({color:0x010102,roughness:1,metalness:0}),
  // Neon strip – max emissive for bloom
  neon: new THREE.MeshStandardMaterial({
    color:0x001122,emissive:new THREE.Color(0x00B4FF),emissiveIntensity:10,
    transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false
  }),
};

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function c01(v){return Math.max(0,Math.min(1,v));}
function eIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function eOut(t){return 1-Math.pow(1-t,3);}
function eIn(t){return t*t*t;}
function eBack(t){const s=1.70158+1;return 1+s*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);}
function lerp(a,b,t){return a+(b-a)*t;}
function rbx(w,h,d,r,s=3){
  const safe=Math.min(r,w/2*.98,h/2*.98,d/2*.98);
  return new RoundedBoxGeometry(w,h,d,s,safe);
}

function mkLabel(title,sub){
  const W=340,H=76,c=document.createElement('canvas');
  c.width=W;c.height=H;
  const cx=c.getContext('2d');
  cx.clearRect(0,0,W,H);
  cx.fillStyle='rgba(3,3,10,0.88)';
  cx.beginPath();if(cx.roundRect)cx.roundRect(4,4,W-8,H-8,3);else cx.rect(4,4,W-8,H-8);cx.fill();
  cx.strokeStyle='rgba(255,255,255,.15)';cx.lineWidth=.8;cx.strokeRect(4.5,4.5,W-9,H-9);
  cx.fillStyle='rgba(255,255,255,.80)';cx.fillRect(4,4,2.5,H-8);
  cx.fillStyle='rgba(255,255,255,.90)';cx.font='500 14px "Helvetica Neue",Arial';cx.fillText(title,14,27);
  cx.fillStyle='rgba(255,255,255,.40)';cx.font='300 10px "Helvetica Neue",Arial';cx.fillText(sub,14,46);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c),transparent:true,opacity:0,depthWrite:false
  }));
  sp.scale.set(1.50,.335,1);
  return sp;
}

/* ══════════════════════════════════════════════
   COMPONENT SYSTEM
══════════════════════════════════════════════ */
const unitGroup=new THREE.Group();
scene.add(unitGroup);
const COMPS=[];

function addComp({meshDefs,asmPos,explodeVec,rotTarget,delay,lt,ls,labelOff}){
  const grp=new THREE.Group();
  grp.position.copy(asmPos);
  const edgeMats=[];

  meshDefs.forEach(def=>{
    const {geo,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0,noEdge=false}=def;
    const m=new THREE.Mesh(geo,mat);
    m.position.set(px,py,pz);m.rotation.set(rx,ry,rz);
    m.castShadow=true;m.receiveShadow=true;
    grp.add(m);
    if(!noEdge){
      // emissive halo – blooms when exploded
      const hMat=new THREE.MeshBasicMaterial({
        color:0xFFFFFF,transparent:true,opacity:0,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide
      });
      const h=new THREE.Mesh(geo,hMat);
      h.position.set(px,py,pz);h.rotation.set(rx,ry,rz);h.scale.setScalar(1.025);
      grp.add(h);edgeMats.push(hMat);
    }
  });

  const lbl=mkLabel(lt,ls);
  if(labelOff)lbl.position.copy(labelOff);else lbl.position.y=.32;
  grp.add(lbl);
  unitGroup.add(grp);
  COMPS.push({
    grp,edgeMats,labelMat:lbl.material,
    asmPos:asmPos.clone(),explodeVec:explodeVec.clone(),
    rotTarget:rotTarget||new THREE.Euler(0,0,0),
    // runtime state
    vel:new THREE.Vector3(),driftRot:new THREE.Euler(
      (Math.random()-.5)*.008,(Math.random()-.5)*.012,(Math.random()-.5)*.006
    ),
    delay
  });
}

/* ══════════════════════════════════════════════
   10 COMPONENTS
══════════════════════════════════════════════ */

/* 1 · Platine de fixation */
addComp({
  meshDefs:[
    {geo:rbx(3.18,1.22,.042,.010),mat:M.metal},
    ...[[-1.2,.46],[1.2,.46],[-1.2,-.46],[1.2,-.46]].map(([px,py])=>({
      geo:new THREE.CylinderGeometry(.028,.028,.045,14),mat:M.void,px,py,rz:Math.PI/2,noEdge:true
    })),
    {geo:rbx(3.14,.042,.042,.008),mat:M.metal,py:.24,noEdge:true},
    {geo:rbx(3.14,.042,.042,.008),mat:M.metal,py:-.24,noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,0,-UD/2-.022),
  explodeVec:new THREE.Vector3(0,0,-3.4),
  rotTarget:new THREE.Euler(0,.15,.06),
  delay:.00,lt:'Platine de fixation',ls:'Acier galvanisé · 2 mm',
  labelOff:new THREE.Vector3(-.7,-.78,0)
});

/* 2 · Carrosserie arrière */
addComp({
  meshDefs:[
    {geo:rbx(2.96,1.06,.72,.040),mat:M.inner},
    {geo:rbx(2.78,.88,.66,.032),mat:M.void,noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,0,-.06),
  explodeVec:new THREE.Vector3(0,0,-1.4),
  rotTarget:new THREE.Euler(-.06,.12,0),
  delay:.06,lt:'Carrosserie arrière',ls:'ABS · Ivoire mat',
  labelOff:new THREE.Vector3(1.18,.68,0)
});

/* 3 · Échangeur thermique */
{
  const fins=[];
  for(let i=0;i<18;i++)fins.push({
    geo:rbx(2.52,.003,.118,.001,1),mat:M.finSep,py:-.32+i*.038,noEdge:true
  });
  const tubes=[];
  for(let r=0;r<4;r++)tubes.push({
    geo:new THREE.CylinderGeometry(.012,.012,2.52,12),
    mat:mkMat({color:0x3A1A08,roughness:.20,metalness:.98}),
    py:-.20+r*.132,rz:Math.PI/2,noEdge:true
  });
  addComp({
    meshDefs:[{geo:rbx(2.55,.64,.115,.025),mat:M.alu},...fins,...tubes],
    asmPos:new THREE.Vector3(0,.18,-.15),
    explodeVec:new THREE.Vector3(.3,1.7,-1.4),
    rotTarget:new THREE.Euler(-.14,-.10,.06),
    delay:.13,lt:'Échangeur thermique',ls:'Alu / cuivre · R-32',
    labelOff:new THREE.Vector3(.98,.65,0)
  });
}

/* 4 · Turbine centrifuge */
{
  const blades=Array.from({length:20},(_,i)=>{
    const a=i/20*Math.PI*2;
    return{geo:rbx(.020,.74,.040,.007,2),mat:M.fan,
      px:Math.cos(a)*.092,pz:Math.sin(a)*.092,ry:a,noEdge:true};
  });
  addComp({
    meshDefs:[{geo:new THREE.CylinderGeometry(.120,.120,2.74,32),mat:M.fan,rz:Math.PI/2},...blades],
    asmPos:new THREE.Vector3(0,-.03,.08),
    explodeVec:new THREE.Vector3(0,1.3,.3),
    rotTarget:new THREE.Euler(0,0,.22),
    delay:.22,lt:'Turbine centrifuge',ls:'Ø 92 mm · PP · Silencieux',
    labelOff:new THREE.Vector3(-1.28,.62,0)
  });
}

/* 5 · Bac à condensats */
addComp({
  meshDefs:[
    {geo:rbx(2.72,.070,.66,.015),mat:M.drain},
    {geo:new THREE.CylinderGeometry(.018,.018,.086,10),mat:M.void,px:-1.1,noEdge:true},
    {geo:rbx(2.66,.012,.018,.004),mat:M.drain,py:-.031,pz:.32,noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,-UH/2+.035,.02),
  explodeVec:new THREE.Vector3(0,-1.0,0),
  rotTarget:new THREE.Euler(.12,0,.06),
  delay:.32,lt:'Bac à condensats',ls:'PS · Anti-corrosion',
  labelOff:new THREE.Vector3(.88,-.48,0)
});

/* 6 · Carte électronique */
{
  const chips=[
    {w:.072,h:.072,d:.027,px:-.10,py:.066,pz:.020,e:false},
    {w:.090,h:.030,d:.020,px:.092,py:.082,pz:.020,e:false},
    {w:.034,h:.034,d:.016,px:-.10,py:-.072,pz:.020,e:true},
    {w:.055,h:.020,d:.016,px:.025,py:-.072,pz:.020,e:false},
    {w:.020,h:.020,d:.014,px:.085,py:-.055,pz:.020,e:true},
  ];
  const traces=[
    {py:.044},{py:-.012},{py:-.055}
  ];
  addComp({
    meshDefs:[
      {geo:rbx(.40,.30,.018,.006),mat:M.pcb},
      ...chips.map(({w,h,d,px,py,pz,e})=>({
        geo:rbx(w,h,d,.003,2),
        mat:new THREE.MeshPhysicalMaterial({
          color:e?0x001606:0x0A0A0A,roughness:.4,metalness:.55,
          emissive:e?new THREE.Color(0x004A1A):undefined,emissiveIntensity:e?4.0:0,
          clearcoat:.3
        }),
        px,py,pz,noEdge:true
      })),
      ...traces.map(({py})=>({
        geo:rbx(.34,.002,.001,.0005,1),
        mat:new THREE.MeshStandardMaterial({
          color:0x001005,emissive:new THREE.Color(0x005020),emissiveIntensity:5.0
        }),
        py,pz:.01,noEdge:true
      })),
    ],
    asmPos:new THREE.Vector3(UW/2-.26,.08,0),
    explodeVec:new THREE.Vector3(1.95,.28,0),
    rotTarget:new THREE.Euler(.10,.18,-.12),
    delay:.42,lt:'Carte électronique',ls:'WiFi · IA Daikin · Capteurs',
    labelOff:new THREE.Vector3(.40,.44,0)
  });
}

/* 7 · Filtre à air */
{
  const grid=Array.from({length:16},(_,i)=>({
    geo:rbx(2.48,.002,.009,.001,1),
    mat:new THREE.MeshPhysicalMaterial({color:0x181820,roughness:.88,metalness:.05}),
    py:-.42+i*.058,noEdge:true
  }));
  addComp({
    meshDefs:[{geo:rbx(2.50,.85,.009,.006),mat:M.filter},...grid],
    asmPos:new THREE.Vector3(0,.01,UD/2-.10),
    explodeVec:new THREE.Vector3(-.3,.65,1.3),
    rotTarget:new THREE.Euler(.09,-.14,0),
    delay:.52,lt:'Filtre à air',ls:'Maille PP · Lavable · Anti-allergènes',

/* 8 · Panneau avant Stylish */
{

const sMs=[];
[{w:2.88,h:.008,ei:10},{w:2.86,h:.024,ei:4},{w:2.82,h:.065,ei:1.4}].forEach(({w,h,ei})=>{

const floor=new THREE.Mesh(

/* ══════════════════════════════════════════════
   INTERACTION
══════════════════════════════════════════════ */
let drag=false,lx=0,ly=0,velY=0,velX=0,manY=.4,manX=.04,autoOrbit=true,autoT=0;
function dS(x,y){drag=true;lx=x;ly=y;autoOrbit=false;clearTimeout(dS._t);}
function dE(){drag=false;dS._t=setTimeout(()=>{autoOrbit=true;autoT=manY/.22;},7000);}
function dM(x,y){if(!drag)return;velY+=(x-lx)*.007;velX+=(y-ly)*.004;lx=x;ly=y;}
const cv=renderer.domElement;
cv.addEventListener('mousedown',e=>dS(e.clientX,e.clientY));
addEventListener('mouseup',dE);
addEventListener('mousemove',e=>dM(e.clientX,e.clientY));
cv.addEventListener('touchstart',e=>{dS(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
addEventListener('touchend',dE);
addEventListener('touchmove',e=>dM(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

/* ══════════════════════════════════════════════
   STATE MACHINE
══════════════════════════════════════════════ */
const STATES=["Vue d'ensemble","Décomposition","Vue éclatée","Assemblage","Vue finale"];
const DURS=[6.5,6.0,8.5,5.5,5.5];
let st=0,stT=0;
document.getElementById('phase').textContent=STATES[0];
function setDots(i){for(let k=0;k<5;k++)document.getElementById('d'+k).className='dot'+(k===i?' on':'');}

const HL=[
  {top:'Stylish · R-32',main:'Crafted<br><em>in precision.</em>',sub:'Scroll to witness the anatomy of silence — from void to form, from raw engineering to the invisible.'},
  {top:'Anatomie',main:'Layer<br><em>by layer.</em>',sub:'Each component engineered for a singular purpose. Silence. Efficiency. Form.'},
  {top:'Vue éclatée',main:'Every<br><em>detail.</em>',sub:'12 components. Zero compromise. The architecture of comfort, exposed.'},
  {top:'Assemblage',main:'Back<br><em>to one.</em>',sub:'Precision recalled. Every part in its place, every tolerance met.'},
  {top:'Daikin Stylish',main:'Materialized<br><em>from mist.</em>',sub:'R-32 · Inverter · Made in Japan · A·5·W'}
];
const hlEl=document.getElementById('headline');
function setHL(i){
  const h=HL[i];
  hlEl.style.opacity='0';hlEl.style.transform='translateY(12px)';
  setTimeout(()=>{
    document.getElementById('hl-top').textContent=h.top;
    document.getElementById('hl-main').innerHTML=h.main;
    document.getElementById('hl-sub').textContent=h.sub;
    hlEl.style.opacity='1';hlEl.style.transform='translateY(0)';
  },400);
}
setTimeout(()=>setHL(0),1200);

// camera rig
const camR={r:6.0,phi:.30};
const introS=new THREE.Vector3(.0,.02,1.2);
const introE=new THREE.Vector3(4.5,2.0,6.5);
let introT=0,introDone=false;
const tmpV=new THREE.Vector3();

/* ══════════════════════════════════════════════
   ANIMATE
══════════════════════════════════════════════ */
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const et=clock.elapsedTime;

  // intro dolly
  if(!introDone){
    introT+=dt;
    const p=1-Math.pow(1-c01(introT/3.0),4);
    camera.position.lerpVectors(introS,introE,p);
    camera.lookAt(0,0,0);
    if(p>=1)introDone=true;
  }

  // state
  stT+=dt;
  if(stT>DURS[st]){
    stT=0;st=(st+1)%5;
    document.getElementById('phase').textContent=STATES[st];
    document.getElementById('bar-fill').style.width='0';
    setDots(st);setHL(st);
  }
  document.getElementById('bar-fill').style.width=(c01(stT/DURS[st])*100)+'%';

  // explode progress
  let explP=0;
  if     (st===0) explP=0;
  else if(st===1) explP=eOut(c01(stT/DURS[1]));
  else if(st===2) explP=1;
  else if(st===3) explP=1-eIn(c01(stT/DURS[3]));
  else            explP=0;

  // component update
  COMPS.forEach(comp=>{
    const raw=c01((explP-comp.delay)/(1-comp.delay*.5));
    // easeBack gives slight overshoot on the way out
    const cpP=c01(st===1||st===3?eIO(raw):raw===1?eBack(c01((raw-.0)/.98)):eIO(raw));

    tmpV.copy(comp.asmPos).addScaledVector(comp.explodeVec,cpP);
    comp.grp.position.copy(tmpV);

    // tumble rotation with slight continuous drift in exploded state
    const driftFactor=(st===2)?1:0;
    comp.grp.rotation.x=lerp(comp.grp.rotation.x,comp.rotTarget.x*cpP+comp.driftRot.x*et*driftFactor,dt*3);
    comp.grp.rotation.y=lerp(comp.grp.rotation.y,comp.rotTarget.y*cpP+comp.driftRot.y*et*driftFactor,dt*3);
    comp.grp.rotation.z=lerp(comp.grp.rotation.z,comp.rotTarget.z*cpP+comp.driftRot.z*et*driftFactor,dt*3);

    // halo bloom
    const glow=cpP>.03?eOut((cpP-.03)/.97):0;
    comp.edgeMats.forEach(em=>{em.opacity=glow*.12;});

    // labels
    const lblT=(st===2&&cpP>.88)?c01((stT-2.2)/2.0):0;
    comp.labelMat.opacity=lerp(comp.labelMat.opacity,lblT,dt*2.0);
  });

  // neons
  const nAmp=eOut(explP);
  nA.intensity=nAmp*5.0;nB.intensity=nAmp*3.0;nC.intensity=nAmp*2.5;
  nC.position.set(Math.sin(et*.55)*.7,Math.cos(et*.38)*.3,nAmp*.9);
  nA.position.set(-Math.sin(et*.42)*.6,0,0);

  // floor glow
  glowPool.material.opacity=nAmp*.18+Math.sin(et*1.4)*.03;

  // LED strip
  const sOn=(st===0||st===4)?1:1-explP*.38;
  const pulse=.44+.28*Math.sin(et*1.55+.4);
  sMs[0].emissiveIntensity=10*pulse*sOn;
  sMs[1].emissiveIntensity=4*pulse*sOn;
  sMs[2].emissiveIntensity=1.4*pulse*sOn;
  sMs[0].opacity=sOn*pulse;sMs[1].opacity=.15*sOn;sMs[2].opacity=.05*sOn;

  // spotlight follows group slightly
  key.position.set(
    lerp(key.position.x,0,dt*.8),
    lerp(key.position.y,11+explP*.5,dt*.8),
    lerp(key.position.z,5+explP*1.5,dt*.8)
  );

  // orbit
  if(introDone){
    if(autoOrbit){autoT+=dt;manY=autoT*.22;manX=Math.sin(autoT*.26)*.038;}
    else{manY+=velY;manX+=velX;manX=Math.max(-.42,Math.min(.42,manX));velY*=.90;velX*=.90;}
    const tR={0:5.8,1:7.0,2:8.0,3:6.5,4:5.5}[st]||6.2;
    const tP={0:.28,1:.33,2:.40,3:.31,4:.24}[st]||.30;
    camR.r=lerp(camR.r,tR,dt*1.1);camR.phi=lerp(camR.phi,tP,dt*1.3);
    camera.position.set(
      Math.sin(manY)*Math.cos(camR.phi)*camR.r,
      Math.sin(camR.phi)*camR.r+manX*1.5,
      Math.cos(manY)*Math.cos(camR.phi)*camR.r
    );
    camera.lookAt(0,.04,0);
  }

  // float
  unitGroup.position.y=Math.sin(et*.40)*.018;

  // PCB blink
  M.pcb.emissiveIntensity=3.0+1.2*Math.sin(et*2.9);

  composer.render();
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});
</script>
