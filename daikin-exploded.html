<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daikin Stylish – Anatomie 3D</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020204;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;z-index:0}
#ui{position:fixed;inset:0;z-index:1;pointer-events:none}

#brand{position:absolute;top:38px;left:46px;font:500 9px/1 sans-serif;
  letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,.18)}
#tagline{position:absolute;top:38px;right:46px;text-align:right;font:400 8px/1 sans-serif;
  letter-spacing:4px;text-transform:uppercase;color:rgba(0,195,255,.22)}

#phase-wrap{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px}
#phase{font:400 8px/1 sans-serif;letter-spacing:6px;text-transform:uppercase;
  color:rgba(0,200,255,.42);white-space:nowrap}
#bar{width:220px;height:1px;background:rgba(0,140,220,.10)}
#bar-fill{height:100%;background:linear-gradient(90deg,transparent,rgba(0,195,255,.50),transparent);width:0;transition:none}

#dots{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  display:flex;gap:9px}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(0,150,255,.18);
  transition:background .5s}
.dot.active{background:rgba(0,195,255,.70)}

#hint{position:absolute;bottom:38px;right:46px;font:400 7px/1 sans-serif;
  letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.10)}

#corner-tl,#corner-tr,#corner-bl,#corner-br{position:absolute;width:18px;height:18px;opacity:.20}
#corner-tl{top:22px;left:26px;border-top:1px solid #00C8FF;border-left:1px solid #00C8FF}
#corner-tr{top:22px;right:26px;border-top:1px solid #00C8FF;border-right:1px solid #00C8FF}
#corner-bl{bottom:22px;left:26px;border-bottom:1px solid #00C8FF;border-left:1px solid #00C8FF}
#corner-br{bottom:22px;right:26px;border-bottom:1px solid #00C8FF;border-right:1px solid #00C8FF}
</style>
</head>
<body>
<div id="ui">
  <div id="brand">Daikin</div>
  <div id="tagline">Stylish · R-32 · Inverter</div>
  <div id="corner-tl"></div><div id="corner-tr"></div>
  <div id="corner-bl"></div><div id="corner-br"></div>
  <div id="phase-wrap">
    <div id="phase">Vue d'ensemble</div>
    <div id="bar"><div id="bar-fill"></div></div>
  </div>
  <div id="dots">
    <div class="dot active" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div>
  </div>
  <div id="hint">Glisser pour pivoter</div>
</div>

<!-- Classic scripts (work via file://). Order matters: deps first. -->
<script src="three.min.js"></script>
<script src="libjs/shaders/CopyShader.js"></script>
<script src="libjs/shaders/LuminosityHighPassShader.js"></script>
<script src="libjs/postprocessing/Pass.js"></script>
<script src="libjs/postprocessing/ShaderPass.js"></script>
<script src="libjs/postprocessing/MaskPass.js"></script>
<script src="libjs/postprocessing/EffectComposer.js"></script>
<script src="libjs/postprocessing/RenderPass.js"></script>
<script src="libjs/postprocessing/UnrealBloomPass.js"></script>
<script src="libjs/geometries/RoundedBoxGeometry.js"></script>
<script>
'use strict';
const { RoundedBoxGeometry, EffectComposer, RenderPass, UnrealBloomPass } = THREE;

/* ───────────────────────────────────────────────
   RENDERER
─────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type     = THREE.PCFSoftShadowMap;
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure= 1.10;
renderer.outputEncoding     = THREE.sRGBEncoding;
document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

/* ───────────────────────────────────────────────
   SCENE & CAMERA
─────────────────────────────────────────────── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, innerWidth/innerHeight, 0.01, 120);
camera.position.set(4.2, 1.8, 6.0);
camera.lookAt(0, 0, 0);

/* ───────────────────────────────────────────────
   ENVIRONMENT MAP  (subtle dark env for reflections)
─────────────────────────────────────────────── */
{
  const W=512, H=256;
  const ec=document.createElement('canvas'); ec.width=W; ec.height=H;
  const ex=ec.getContext('2d');
  const bg=ex.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#02020C'); bg.addColorStop(.45,'#010108'); bg.addColorStop(1,'#000003');
  ex.fillStyle=bg; ex.fillRect(0,0,W,H);
  // horizon glow
  const hg=ex.createLinearGradient(0,H*.38,0,H*.62);
  hg.addColorStop(0,'rgba(0,0,0,0)');
  hg.addColorStop(.5,'rgba(0,60,120,.09)');
  hg.addColorStop(1,'rgba(0,0,0,0)');
  ex.fillStyle=hg; ex.fillRect(0,0,W,H);
  // subtle reflection dots
  [[80,128],[240,122],[400,130],[168,120],[336,125]].forEach(([x,y])=>{
    const rg=ex.createRadialGradient(x,y,0,x,y,55);
    rg.addColorStop(0,'rgba(0,120,220,.06)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    ex.fillStyle=rg; ex.fillRect(0,0,W,H);
  });
  const et=new THREE.CanvasTexture(ec);
  et.mapping=THREE.EquirectangularReflectionMapping;
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromEquirectangular(et).texture;
  et.dispose(); pmrem.dispose();
}

/* ───────────────────────────────────────────────
   POST-PROCESSING  –  Bloom
─────────────────────────────────────────────── */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.70,   // strength
  0.38,   // radius
  0.72    // threshold – only bright emissives bloom
);
composer.addPass(bloomPass);

/* ───────────────────────────────────────────────
   BACKGROUND SPHERE  (deep void)
─────────────────────────────────────────────── */
{
  const c=document.createElement('canvas'); c.width=2; c.height=512;
  const cx=c.getContext('2d');
  const g=cx.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#04040F'); g.addColorStop(.5,'#020208'); g.addColorStop(1,'#010103');
  cx.fillStyle=g; cx.fillRect(0,0,2,512);
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(70,24,12),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.BackSide,depthWrite:false})
  ));
}

/* ───────────────────────────────────────────────
   LIGHTS
─────────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0x040410, 1.0));

// Key – warm white, upper-left-front, soft shadow
const kl = new THREE.DirectionalLight(0xFFFFF5, 2.4);
kl.position.set(-4, 10, 5);
kl.castShadow = true;
kl.shadow.mapSize.set(2048, 2048);
Object.assign(kl.shadow.camera,{near:1,far:25,left:-8,right:8,top:8,bottom:-8});
kl.shadow.bias = -0.0004;
kl.shadow.radius = 14;
scene.add(kl);

// Rim – cold white from behind, edge separation
const rl = new THREE.DirectionalLight(0xE8EEFF, 0.65);
rl.position.set(2, 6, -8);
scene.add(rl);

// Fill – very dim right side
const fl = new THREE.DirectionalLight(0xCCCCDD, 0.15);
fl.position.set(9, 1, 3);
scene.add(fl);

// Under-light – cold bottom fill, dramatic
const ul = new THREE.DirectionalLight(0x000814, 0.0);
ul.position.set(0, -4, 2);
scene.add(ul);

// Neon accents (animated)
const nA = new THREE.PointLight(0x00CCFF, 0.0, 7.0, 2); scene.add(nA);
const nB = new THREE.PointLight(0x0044FF, 0.0, 5.0, 2); nB.position.set(0.4,0.1,0.3); scene.add(nB);
const nC = new THREE.PointLight(0x00AAFF, 0.0, 9.0, 2); scene.add(nC);
const nD = new THREE.PointLight(0x00FFCC, 0.0, 4.0, 2); nD.position.set(-0.4,-0.2,0.4); scene.add(nD);

/* ───────────────────────────────────────────────
   PARTICLES  –  bokeh atmosphere
─────────────────────────────────────────────── */
{
  const N=900, pos=new Float32Array(N*3), col=new Float32Array(N*3), siz=new Float32Array(N);
  const c1=new THREE.Color(0x2244CC), c2=new THREE.Color(0xAABBEE), c3=new THREE.Color(0x003366);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*60; pos[i*3+1]=(Math.random()-.5)*36; pos[i*3+2]=(Math.random()-.5)*45-6;
    const c=[c1,c2,c3][Math.floor(Math.random()*3)];
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i]=0.012+Math.random()*0.018;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:0.015, sizeAttenuation:true, vertexColors:true,
    transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, depthWrite:false
  })));
}

/* ───────────────────────────────────────────────
   UNIT DIMENSIONS  795×295×225 mm → scale 3.0 wide
─────────────────────────────────────────────── */
const UW=3.0, UH=3.0*295/795, UD=3.0*225/795;

/* ───────────────────────────────────────────────
   MATERIALS  –  MeshPhysicalMaterial for realism
─────────────────────────────────────────────── */
const M = {
  // Matte black ABS with clearcoat (rear body, top cover)
  body: new THREE.MeshPhysicalMaterial({
    color:0x0C0C11, roughness:0.82, metalness:0.10,
    clearcoat:0.20, clearcoatRoughness:0.55
  }),
  // Premium gloss front panel – the hero piece
  front: new THREE.MeshPhysicalMaterial({
    color:0x10101A, roughness:0.68, metalness:0.18,
    clearcoat:0.90, clearcoatRoughness:0.10,
    reflectivity:0.55, envMapIntensity:1.4
  }),
  // Interior housing – off-white plastic
  inner: new THREE.MeshPhysicalMaterial({
    color:0xBBC2CE, roughness:0.70, metalness:0.04,
    clearcoat:0.10, clearcoatRoughness:0.65
  }),
  // Aluminum fins – brushed metal
  alu: new THREE.MeshPhysicalMaterial({
    color:0x1E2A38, roughness:0.18, metalness:0.98,
    envMapIntensity:2.0
  }),
  finSep: new THREE.MeshPhysicalMaterial({
    color:0x0D1520, roughness:0.25, metalness:0.95,
    envMapIntensity:1.8
  }),
  // PCB – dark green, emissive
  pcb: new THREE.MeshPhysicalMaterial({
    color:0x051206, roughness:0.62, metalness:0.06,
    emissive:new THREE.Color(0x001A06), emissiveIntensity:1.8
  }),
  // Fan / turbine
  fan: new THREE.MeshPhysicalMaterial({
    color:0x111115, roughness:0.82, metalness:0.18,
    clearcoat:0.15, clearcoatRoughness:0.70
  }),
  // Drain pan – light grey plastic
  drain: new THREE.MeshPhysicalMaterial({
    color:0xC0C8D5, roughness:0.68, metalness:0.0
  }),
  // Vane – very dark matte
  vane: new THREE.MeshPhysicalMaterial({
    color:0x090910, roughness:0.90, metalness:0.08,
    clearcoat:0.12, clearcoatRoughness:0.80
  }),
  // Air filter – translucent mesh
  filter: new THREE.MeshPhysicalMaterial({
    color:0x111118, roughness:0.88, metalness:0.0,
    transparent:true, opacity:0.78
  }),
  // Mounting bracket – galvanized steel
  metal: new THREE.MeshPhysicalMaterial({
    color:0x1A2030, roughness:0.38, metalness:0.88,
    envMapIntensity:1.6
  }),
  // Deep void for holes
  void: new THREE.MeshPhysicalMaterial({
    color:0x020204, roughness:1.0, metalness:0.0
  }),
  // Emissive neon – will bloom
  neonLine: new THREE.MeshStandardMaterial({
    color:0x002244, roughness:0.3, metalness:0.0,
    emissive:new THREE.Color(0x00C8FF), emissiveIntensity:6.0
  }),
};

/* ───────────────────────────────────────────────
   HELPERS
─────────────────────────────────────────────── */
function clamp01(v){return Math.max(0,Math.min(1,v));}
function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeIn(t){return t*t*t;}
function easeOutBack(t){const c=1.70158+1,b=1.70158;return 1+c*Math.pow(t-1,3)+b*Math.pow(t-1,2);}
function lerp(a,b,t){return a+(b-a)*t;}

// Rounded box shorthand: rbx(w,h,d, radius, segs=3)
function rbx(w,h,d,r,s=3){
  const safe=Math.min(r,w/2*.98,h/2*.98,d/2*.98);
  return new RoundedBoxGeometry(w,h,d,s,safe);
}

function mkLabel(title,sub){
  const W=340,H=78;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const cx=c.getContext('2d');
  cx.clearRect(0,0,W,H);
  // glass bg
  cx.fillStyle='rgba(2,5,14,0.92)'; cx.beginPath();
  cx.roundRect(4,4,W-8,H-8,3); cx.fill();
  cx.strokeStyle='rgba(0,175,255,0.35)'; cx.lineWidth=1;
  cx.strokeRect(4,4,W-8,H-8);
  // left accent bar
  const ab=cx.createLinearGradient(4,4,4,H-4);
  ab.addColorStop(0,'rgba(0,195,255,0.9)');ab.addColorStop(1,'rgba(0,100,200,0.4)');
  cx.fillStyle=ab; cx.fillRect(4,4,3,H-8);
  // title
  cx.fillStyle='rgba(220,235,255,0.95)'; cx.font='600 15px "Helvetica Neue",Arial';
  cx.fillText(title,14,28);
  // sub
  cx.fillStyle='rgba(0,180,255,0.68)'; cx.font='400 11px "Helvetica Neue",Arial';
  cx.fillText(sub,14,48);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c),transparent:true,opacity:0.0,depthWrite:false
  }));
  sp.scale.set(1.50,0.345,1);
  return sp;
}

/* ───────────────────────────────────────────────
   COMPONENT SYSTEM
─────────────────────────────────────────────── */
const unitGroup = new THREE.Group();
scene.add(unitGroup);
const COMPS = [];

function addComp({meshDefs, asmPos, explodeVec, rotTarget, delay, lt, ls, labelOff, edgeCol}){
  const grp = new THREE.Group();
  grp.position.copy(asmPos);
  const edgeMats = [];

  meshDefs.forEach(def=>{
    const {geo,mat,px=0,py=0,pz=0,rx=0,ry=0,rz=0,noEdge=false}=def;
    const m=new THREE.Mesh(geo,mat);
    m.position.set(px,py,pz);
    m.rotation.set(rx,ry,rz);
    m.castShadow=true; m.receiveShadow=true;
    grp.add(m);

    if(!noEdge){
      // Edge glow – will bloom via bloom pass
      const el=new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({
          color:edgeCol||0x00CCFF,
          transparent:true,opacity:0.0,
          blending:THREE.AdditiveBlending,depthWrite:false
        })
      );
      el.position.set(px,py,pz);
      el.rotation.set(rx,ry,rz);
      grp.add(el);
      edgeMats.push(el.material);

      // Back-side emissive halo (makes bloom pop)
      const haloMat=new THREE.MeshBasicMaterial({
        color:edgeCol||0x002233,transparent:true,opacity:0,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide
      });
      const halo=new THREE.Mesh(geo,haloMat);
      halo.position.set(px,py,pz);
      halo.rotation.set(rx,ry,rz);
      halo.scale.setScalar(1.035);
      grp.add(halo);
      edgeMats.push({bloom:true,mat:haloMat});
    }
  });

  const lbl=mkLabel(lt,ls);
  if(labelOff) lbl.position.copy(labelOff); else lbl.position.y=0.32;
  grp.add(lbl);
  unitGroup.add(grp);

  COMPS.push({
    grp, edgeMats, labelMat:lbl.material,
    asmPos:asmPos.clone(),
    explodeVec:explodeVec.clone(),
    rotTarget:rotTarget||new THREE.Euler(0,0,0),
    delay
  });
}

/* ───────────────────────────────────────────────
   10 COMPONENTS  (RoundedBoxGeometry everywhere)
─────────────────────────────────────────────── */

/* 1 · Platine de fixation – galvanised steel bracket */
addComp({
  meshDefs:[
    {geo:rbx(3.18,1.22,0.042, 0.010), mat:M.metal},
    {geo:new THREE.CylinderGeometry(.028,.028,.045,14),mat:M.void,px:-1.20,py:.46,rz:Math.PI/2,noEdge:true},
    {geo:new THREE.CylinderGeometry(.028,.028,.045,14),mat:M.void,px: 1.20,py:.46,rz:Math.PI/2,noEdge:true},
    {geo:new THREE.CylinderGeometry(.028,.028,.045,14),mat:M.void,px:-1.20,py:-.46,rz:Math.PI/2,noEdge:true},
    {geo:new THREE.CylinderGeometry(.028,.028,.045,14),mat:M.void,px: 1.20,py:-.46,rz:Math.PI/2,noEdge:true},
    // reinforcement ribs
    {geo:rbx(3.16,0.045,0.042, 0.008),mat:M.metal,py:.24,noEdge:true},
    {geo:rbx(3.16,0.045,0.042, 0.008),mat:M.metal,py:-.24,noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,0,-UD/2-.022),
  explodeVec:new THREE.Vector3(0,0,-3.2),
  rotTarget:new THREE.Euler(0,0.08,0.04),
  delay:0.0, edgeCol:0x0077EE,
  lt:'Platine de fixation', ls:'Acier galvanisé · 2 mm',
  labelOff:new THREE.Vector3(-.7,-.75,0)
});

/* 2 · Carrosserie arrière – main rear shell */
addComp({
  meshDefs:[
    {geo:rbx(2.96,1.06,0.72, 0.038), mat:M.inner},
    // subtle wall thickness detail
    {geo:rbx(2.80,0.90,0.68, 0.030), mat:M.void, noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,0,-.06),
  explodeVec:new THREE.Vector3(0,0,-1.3),
  rotTarget:new THREE.Euler(-0.05,0.10,0),
  delay:0.06, edgeCol:0x3388FF,
  lt:'Carrosserie arrière', ls:'ABS recyclé · Blanc ivoire',
  labelOff:new THREE.Vector3(1.15,.65,0)
});

/* 3 · Échangeur thermique – aluminium fins + copper tubes */
{
  const fins=[];
  for(let i=0;i<16;i++) fins.push({
    geo:rbx(2.52,0.003,0.120, 0.001, 1), mat:M.finSep,
    py:-.30+i*.040, noEdge:true
  });
  // Copper tubes (4 passes)
  const tubes=[];
  for(let r=0;r<4;r++) tubes.push({
    geo:new THREE.CylinderGeometry(0.012,0.012,2.52,12),
    mat:new THREE.MeshPhysicalMaterial({color:0x5A2E10,roughness:0.25,metalness:0.95,envMapIntensity:2}),
    py:-.20+r*.135, rz:Math.PI/2, noEdge:true
  });
  addComp({
    meshDefs:[
      {geo:rbx(2.55,0.62,0.115, 0.022), mat:M.alu},
      ...fins, ...tubes
    ],
    asmPos:new THREE.Vector3(0,.18,-.15),
    explodeVec:new THREE.Vector3(.25,1.6,-1.3),
    rotTarget:new THREE.Euler(-0.12,-0.08,0.05),
    delay:0.13, edgeCol:0x00EEFF,
    lt:'Échangeur thermique', ls:'Aluminium / tube cuivre · R-32',
    labelOff:new THREE.Vector3(.95,.60,0)
  });
}

/* 4 · Turbine centrifuge – cross-flow fan */
{
  const blades=[];
  for(let i=0;i<18;i++){
    const a=i/18*Math.PI*2;
    blades.push({
      geo:rbx(0.022,0.72,0.045, 0.008, 2),
      mat:M.fan,
      px:Math.cos(a)*.09, pz:Math.sin(a)*.09,
      ry:a, noEdge:true
    });
  }
  addComp({
    meshDefs:[
      {geo:new THREE.CylinderGeometry(0.118,0.118,2.72,28),mat:M.fan,rz:Math.PI/2},
      ...blades
    ],
    asmPos:new THREE.Vector3(0,-.03,.08),
    explodeVec:new THREE.Vector3(0,1.2,.3),
    rotTarget:new THREE.Euler(0,0,0.18),
    delay:0.22, edgeCol:0x55CCFF,
    lt:'Turbine centrifuge', ls:'Ø 92 mm · PP soufflé · Silencieux',
    labelOff:new THREE.Vector3(-1.25,.60,0)
  });
}

/* 5 · Bac à condensats */
addComp({
  meshDefs:[
    {geo:rbx(2.72,0.070,0.66, 0.014), mat:M.drain},
    {geo:new THREE.CylinderGeometry(.018,.018,.085,10),mat:M.void,px:-1.1,noEdge:true},
    // drain lip
    {geo:rbx(2.68,0.012,0.018, 0.004),mat:M.drain,py:-.031,pz:.32,noEdge:true},
  ],
  asmPos:new THREE.Vector3(0,-UH/2+.035,.02),
  explodeVec:new THREE.Vector3(0,-.95,0),
  rotTarget:new THREE.Euler(0.10,0,0.05),
  delay:0.32, edgeCol:0x0077FF,
  lt:'Bac à condensats', ls:'PS · Anti-corrosion · Évacuation directe',
  labelOff:new THREE.Vector3(.85,-.45,0)
});

/* 6 · Carte électronique – main PCB */
{
  // chip geometries
  const chips=[
    {w:.070,h:.070,d:.026,px:-.10,py:.065,pz:.019,col:0x090909},
    {w:.090,h:.030,d:.020,px:.092,py:.082,pz:.019,col:0x1A1A1A},
    {w:.032,h:.032,d:.016,px:-.10,py:-.072,pz:.019,col:0x001A10},
    {w:.055,h:.020,d:.016,px:.025,py:-.072,pz:.019,col:0x111111},
    {w:.018,h:.018,d:.014,px:.085,py:-.055,pz:.019,col:0x00100A},
  ];
  addComp({
    meshDefs:[
      {geo:rbx(.40,.30,.018, 0.006), mat:M.pcb},

/* ───────────────────────────────────────────────
   INTERACTION
─────────────────────────────────────────────── */
let drag=false,lx=0,ly=0,velY=0,velX=0;
let manY=0.4,manX=0.05,autoOrbit=true,autoT=0;
function dStart(x,y){drag=true;lx=x;ly=y;autoOrbit=false;clearTimeout(dStart._t);}
function dEnd(){drag=false;dStart._t=setTimeout(()=>{autoOrbit=true;autoT=manY/.22;},6000);}
function dMove(x,y){if(!drag)return;velY+=(x-lx)*.007;velX+=(y-ly)*.004;lx=x;ly=y;}
const cvs=renderer.domElement;
cvs.addEventListener('mousedown',e=>dStart(e.clientX,e.clientY));
addEventListener('mouseup',dEnd);
addEventListener('mousemove',e=>dMove(e.clientX,e.clientY));
cvs.addEventListener('touchstart',e=>{dStart(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
addEventListener('touchend',dEnd);
addEventListener('touchmove',e=>dMove(e.touches[0].clientX,e.touches[0].clientY),{passive:true});

/* ───────────────────────────────────────────────
   STATE MACHINE
─────────────────────────────────────────────── */
const STATES=['Vue d\'ensemble','Décomposition','Vue éclatée','Assemblage','Vue finale'];
const DURS  =[6.0, 5.5, 8.0, 5.5, 5.0];
let st=0, stT=0;
document.getElementById('phase').textContent=STATES[0];

function setDots(i){
  for(let k=0;k<5;k++) document.getElementById('d'+k).className='dot'+(k===i?' active':'');
}

const camR={radius:6.0,phi:.28};

/* intro camera */
const introStart=new THREE.Vector3(0.0,0.02,1.4);
const introEnd  =new THREE.Vector3(4.2,1.8,6.0);
let introT=0, introDone=false;

/* ───────────────────────────────────────────────
   ANIMATION LOOP
─────────────────────────────────────────────── */
const clock=new THREE.Clock();
const tmpV=new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const et=clock.elapsedTime;

  /* ── intro cam ── */
  if(!introDone){
    introT+=dt;
    const p=1-Math.pow(1-clamp01(introT/2.8),3);
    camera.position.lerpVectors(introStart,introEnd,p);
    camera.lookAt(0,0,0);
    if(p>=1) introDone=true;
  }

  /* ── state advance ── */
  stT+=dt;
  if(stT>DURS[st]){
    stT=0; st=(st+1)%STATES.length;
    document.getElementById('phase').textContent=STATES[st];
    document.getElementById('bar-fill').style.width='0';
    setDots(st);
  }
  document.getElementById('bar-fill').style.width=(clamp01(stT/DURS[st])*100)+'%';

  /* ── explosion progress ── */
  let explP=0;
  if     (st===0) explP=0;
  else if(st===1) explP=easeOut(clamp01(stT/DURS[1]));
  else if(st===2) explP=1.0;
  else if(st===3) explP=1.0-easeIn(clamp01(stT/DURS[3]));
  else            explP=0;

  /* ── update components ── */
  COMPS.forEach(comp=>{
    const raw=clamp01((explP-comp.delay)/(1-comp.delay*.5));
    const cpP=clamp01(easeIO(raw));

    // Position
    tmpV.copy(comp.asmPos).addScaledVector(comp.explodeVec,cpP);
    comp.grp.position.copy(tmpV);

    // Rotation – each part rotates slightly as it explodes (organic feel)
    comp.grp.rotation.x = comp.rotTarget.x * cpP;
    comp.grp.rotation.y = comp.rotTarget.y * cpP;
    comp.grp.rotation.z = comp.rotTarget.z * cpP;

    // Edge glow
    const glow=cpP>.04?easeOut((cpP-.04)/.96):0;
    comp.edgeMats.forEach(em=>{
      if(em.bloom) em.mat.opacity=glow*.08;
      else em.opacity=glow*.70;
    });

    // Labels fade in during orbit phase
    const lblT=(st===2&&cpP>.90)?clamp01((stT-2.0)/2.0):0;
    comp.labelMat.opacity=lerp(comp.labelMat.opacity,lblT,dt*2.2);
  });

  /* ── neon lights ── */
  nA.intensity = explP * 4.5;
  nB.intensity = explP * 2.8;
  nC.intensity = explP * 2.2;
  nD.intensity = explP * 1.6;
  nC.position.set(Math.sin(et*.55)*.6, Math.cos(et*.38)*.25, explP*.8);
  nD.position.set(-Math.sin(et*.42)*.5, Math.cos(et*.60)*.2, -explP*.5);

  /* ── LED neon strip at air outlet ── */
  const stripOn=(st===0||st===4)?1:1-explP*.45;
  const pulse=.42+.30*Math.sin(et*1.6+0.5);
  stripMats[0].emissiveIntensity = 8.0*pulse*stripOn;
  stripMats[1].emissiveIntensity = 3.5*pulse*stripOn;
  stripMats[2].emissiveIntensity = 1.2*pulse*stripOn;
  stripMats[0].opacity = pulse*stripOn;
  stripMats[1].opacity = .18*stripOn;
  stripMats[2].opacity = .06*stripOn;

  /* ── orbit camera ── */
  if(introDone){
    if(autoOrbit){autoT+=dt;manY=autoT*.22;manX=Math.sin(autoT*.28)*.040;}
    else{manY+=velY;manX+=velX;manX=Math.max(-.40,Math.min(.40,manX));velY*=.90;velX*=.90;}
    const tgtR  ={0:5.8,1:6.8,2:7.8,3:6.4,4:5.4}[st]||6.0;
    const tgtPhi={0:.26,1:.32,2:.38,3:.30,4:.22}[st]||.28;
    camR.radius = lerp(camR.radius,tgtR,dt*1.2);
    camR.phi    = lerp(camR.phi,tgtPhi,dt*1.5);
    camera.position.set(
      Math.sin(manY)*Math.cos(camR.phi)*camR.radius,
      Math.sin(camR.phi)*camR.radius+manX*1.5,
      Math.cos(manY)*Math.cos(camR.phi)*camR.radius
    );
    camera.lookAt(0,.04,0);
  }

  /* ── gentle float ── */
  unitGroup.position.y = Math.sin(et*.42)*.020;

  /* ── PCB blink ── */
  M.pcb.emissiveIntensity = 1.6+.8*Math.sin(et*3.1);

  composer.render();
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloomPass.resolution.set(innerWidth,innerHeight);
});
